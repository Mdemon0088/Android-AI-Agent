name: Build LumiShake Pro APK
on:
  workflow_dispatch:
  push:
    branches:
      - build/lumishake-pro-apk
    paths:
      - 'LumiShakePro/**'
      - '.github/workflows/lumishake-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Build debug APK
        working-directory: LumiShakePro
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LumiShake-Pro-APK
          path: LumiShakePro/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
